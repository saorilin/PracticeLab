services:
  backend:
    image: ghcr.io/saorilin/practicelab-backend:sha-${IMAGE_TAG}

    environment:
      DATABASE_URL: sqlite:////app/data/practicelab.db
      CORS_ORIGINS: http://localhost:8080

    volumes:
      - backend-data:/app/data

    expose:
      - "8000"

  frontend:
    image: ghcr.io/saorilin/practicelab-frontend:sha-${IMAGE_TAG}

    ports:
      - "8080:80"

    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data: