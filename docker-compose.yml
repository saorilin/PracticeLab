services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    environment:
      DATABASE_URL: sqlite:////app/data/practicelab.db
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:${FRONTEND_PORT:-8080}}"

    volumes:
      - backend-data:/app/data

    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - "${FRONTEND_PORT:-8080}:80"

    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data: