services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    environment:
      DATABASE_URL: sqlite:////app/data/practicelab.db
      CORS_ORIGINS: http://localhost:8080

    volumes:
      - backend-data:/app/data

    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - "8080:80"

    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data: