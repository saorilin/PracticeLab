name: Docker Integration Checks

on:
  workflow_call:
    inputs:
      backend-image:
        required: true
        type: string
      frontend-image:
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash # bash --noprofile --norc -eo pipefail

env:
      FRONTEND_PORT: "8080"
      BACKEND_IMAGE: ${{ inputs.backend-image }}
      FRONTEND_IMAGE: ${{ inputs.frontend-image }}

jobs:
  docker-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Download images
        uses: actions/download-artifact@v8
        with:
          name: images
      
      - name: Load images
        run: docker load -i images.tar

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Keep in sync with backend-checks.yml and the base image in backend/Dockerfile.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      # Installed before the containers start, so dependency problems fail fast.
      # No `pip install .`: the integration suite is black-box and does not import the backend.
      - name: Install integration test dependencies
        run: python -m pip install --require-hashes -r backend/requirements-dev.lock

      - name: Start containers from the built images (no rebuild)
        run: docker compose up --no-build --pull never -d --wait --wait-timeout 120

      - name: Run integration tests through Nginx
        env:
          BASE_URL: http://localhost:${{ env.FRONTEND_PORT }}
        run: python -m pytest integration --junitxml=integration-report.xml

      - name: Upload integration test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: integration-report.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Show Compose status
        if: always()
        run: docker compose ps

      - name: Show Compose logs
        if: always()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down -v --remove-orphans