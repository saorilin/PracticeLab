name: Docker Integration Checks

on:
  workflow_call:
    inputs:
      backend-image:
        required: true
        type: string
      frontend-image:
        required: true
        type: string

  workflow_dispatch:
    inputs:
      backend-image:
        required: true
        type: string
      frontend-image:
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash # bash --noprofile --norc -eo pipefail

env:
      FRONTEND_PORT: "8080"
      BACKEND_IMAGE: ${{ inputs.backend-image }}
      FRONTEND_IMAGE: ${{ inputs.frontend-image }}

jobs:
  docker-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Download images
        uses: actions/download-artifact@v8
        with:
          name: images
      
      - name: Load images
        run: docker load -i images.tar

      - name: Start containers from the built images (no rebuild)
        run: docker compose up --no-build --pull never -d --wait --wait-timeout 120

      - name: Check frontend
        run: curl --fail --show-error --silent "http://localhost:${FRONTEND_PORT}/"

      - name: Check backend through Nginx
        run: curl --fail --show-error --silent "http://localhost:${FRONTEND_PORT}/api/v1/health"

      - name: Show Compose status
        if: always()
        run: docker compose ps

      - name: Show Compose logs
        if: always()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down -v --remove-orphans