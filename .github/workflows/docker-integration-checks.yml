name: Docker Integration Checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
      FRONTEND_PORT: "8080"

jobs:
  docker-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build and start containers
        run: docker compose up --build -d --wait --wait-timeout 120

      - name: Check frontend
        run: curl --fail --show-error --silent "http://localhost:${FRONTEND_PORT}/"

      - name: Check backend through Nginx
        run: curl --fail --show-error --silent "http://localhost:${FRONTEND_PORT}/api/v1/health"

      - name: Show Compose status
        if: always()
        run: docker compose ps

      - name: Show Compose logs
        if: always()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down -v --remove-orphans