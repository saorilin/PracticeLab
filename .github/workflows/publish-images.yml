name: Publish Docker Images

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read
    packages: write

jobs:
    publish-images:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
        - name: Checkout code
          uses: actions/checkout@v7

        - name: Login to GHCR
          uses: docker/login-action@v4
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Build and push backend image
          uses: docker/build-push-action@v7
          with:
            context: ./backend
            push: true
            tags: ghcr.io/saorilin/practicelab-backend:sha-${{ github.sha }}

        - name: Build and push frontend image
          uses: docker/build-push-action@v7
          with:
            context: ./frontend
            push: true
            tags: ghcr.io/saorilin/practicelab-frontend:sha-${{ github.sha }}