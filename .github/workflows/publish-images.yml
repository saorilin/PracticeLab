name: Publish Docker Images

on:
    workflow_call:
      inputs:
        backend-image:
          required: true
          type: string
        frontend-image:
          required: true
          type: string

permissions:
    contents: read
    packages: write # Permmision to publish Docker images

defaults:
  run:
    shell: bash

env:
  BACKEND_IMAGE: ${{ inputs.backend-image }}
  FRONTEND_IMAGE: ${{ inputs.frontend-image }}

jobs:
    publish-images:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Download images
              uses: actions/download-artifact@v8
              with:
                name: images
              
            - name: load images
              run: docker load -i images.tar

            - name: Log in to GHCR
              uses: docker/login-action@v4
              with:
                registry: ghcr.io
                username: ${{ github.repository_owner }}
                password: ${{ secrets.GITHUB_TOKEN }}

            - name: Publish images
              run: |
                docker push "$BACKEND_IMAGE"
                docker push "$FRONTEND_IMAGE"

            - name: Record the registry digests (external identity)
              run: |
                backend_ref=$(docker image inspect --format '{{index .RepoDigests 0}}' "$BACKEND_IMAGE")
                frontend_ref=$(docker image inspect --format '{{index .RepoDigests 0}}' "$FRONTEND_IMAGE")
                {
                  echo "### Published images"
                  echo ""
                  echo "| Image | Registry digest |"
                  echo "|---|---|"
                  echo "| \`$BACKEND_IMAGE\` | \`$backend_ref\` |"
                  echo "| \`$FRONTEND_IMAGE\` | \`$frontend_ref\` |"
                } >> "$GITHUB_STEP_SUMMARY"
