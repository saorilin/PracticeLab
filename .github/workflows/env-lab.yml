name: Env lab
on:
    workflow_dispatch:
    push:
        branches:
            - "lab/**"

permissions:
    contents: read

env:
    SCOPE: workflow
    ONLY_WORKFLOW: from-top

jobs:
    lesson-01:
        runs-on: ubuntu-latest
        env:
            MY_VAR: hello
        steps:
            - name: Default variables live on the runner
              run: |
                echo "shell   \$GITHUB_SHA    = $GITHUB_SHA"
                echo "context github.sha     = ${{ github.sha }}"
                echo "env ctx env.GITHUB_SHA = '${{ env.GITHUB_SHA }}'"
                echo "env ctx env.MY_VAR     = '${{ env.MY_VAR }}'"
            - name: List all GITHUB_ variables
              run: env | grep '^GITHUB_' | sort
                
    lesson-02:
        runs-on: ubuntu-latest
        env:
            SCOPE: job
        steps:
            - name: Job overrides workflow
              run: echo "SCOPE=$SCOPE  ONLY_WORKFLOW=$ONLY_WORKFLOW"
            - name: Step overrides job
              env:
                SCOPE: step
              run: echo "SCOPE=$SCOPE"
            - name: Back to job level
              run: echo "SCOPE=$SCOPE"

    lesson-03:
        runs-on: ubuntu-latest
        env:
            COLOR: blue
        steps:
            - name: Expression vs shell
              run: |
                COLOR=red
                echo "shell      \$COLOR      = $COLOR"
                echo "expression env.COLOR = ${{ env.COLOR }}"

# 在 step 之间传值（export 和 $GITHUB_ENV）

    lesson-04:
        runs-on: ubuntu-latest
        steps:
            - name: Try to pass values
              run: |
                export VIA_EXPORT=lost
                echo "VIA_GITHUB_ENV=kept" >> "$GITHUB_ENV"
                echo "same step: VIA_GITHUB_ENV='${VIA_GITHUB_ENV:-<not yet>}'"
            - name: Multi-line value
              run: |
                {
                    echo "NOTES<<EOF"
                    echo "line one"
                    echo "line two"
                    echo "EOF"
                } >> "$GITHUB_ENV"
            - name: Read in the next step
              run: |
                echo "VIA_EXPORT='${VIA_EXPORT:-<unset>}'"
                echo "VIA_GITHUB_ENV='$VIA_GITHUB_ENV'"
                echo "NOTES:"; echo "$NOTES"
                echo "as expression: ${{ env.VIA_GITHUB_ENV }}"

# step outputs（$GITHUB_OUTPUT）

    lesson-05:
        runs-on: ubuntu-latest
        steps:
            - name: Compute image tag
              id: meta
              run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            - name: Use it
              env:
                TAG: ${{ steps.meta.outputs.tag }}
              run: echo "TAG=$TAG"

# 在 job 之间传值（job outputs 和 needs）
              
    lesson-06-produce:
        runs-on: ubuntu-latest
        outputs:
            tag: ${{ steps.meta.outputs.tag }}
        steps:
            - id: meta
              run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

    lesson-06-consume:
        runs-on: ubuntu-latest
        needs: lesson-06-produce
        steps:
            - env:
                TAG: ${{ needs.lesson-06-produce.outputs.tag }}
              run: echo "got TAG=$TAG from another job"

# vars（非敏感配置）

    lesson-07:
        runs-on: ubuntu-latest
        steps:
            - env:
                GREETING: ${{ vars.LAB_GREETING  }}
                MISSING: ${{ vars.DOES_NOT_EXIST }}
                WITH_DEFAULT: ${{ vars.DOES_NOT_EXIST || 'fallback' }}
              run: |
                echo "GREETING=$GREETING"
                echo "MISSING=$MISSING"
                echo "WITH_DEFAULT=$WITH_DEFAULT"

# secrets 和打码

    lesson-08:
        runs-on: ubuntu-latest
        env:
            LAB_SECRET: ${{ secrets.LAB_SECRET }}
        steps:
            - name: Masking
              run: |
                echo "direct:   $LAB_SECRET"
                echo "length:   ${#LAB_SECRET}"
                echo "reversed: $(echo "$LAB_SECRET" | rev)"
            - name: Mask a derived value yourself
              run: |
                DERIVED=$(echo "$LAB_SECRET" | rev)
                echo "::add-mask::$DERIVED"
                echo "derived now: $DERIVED"
            - name: Conditional on a secret (via env)
              if: env.LAB_SECRET != ''
              run: echo "secret is configured"

# 把值传给 action（with:）和传给命令（env:）

    lesson-09:
        runs-on: ubuntu-latest
        steps:
            - name: Value as an action input
              uses: actions/github-script@v8
              with:
                script: 'core.info(`sha from input: ${{ github.sha }}`)'
            - name: Value as an env var for a command
              env:
                IMAGE_TAG: sha-${{ github.sha }}
              run: 'echo "would run: docker pull ghcr.io/owner/app:$IMAGE_TAG"'

# 表达式函数和拼接

    lesson-10:
        runs-on: ubuntu-latest
        env:
            IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/practicelab
            SHORT_REF: ${{ github.ref_name }}
            IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
        steps:
            - run: |
                echo "IMAGE_PREFIX=$IMAGE_PREFIX"
                echo "SHORT_REF=$SHORT_REF"
                echo "IS_MAIN=$IS_MAIN"
                echo "upper owner: ${{ github.repository_owner }}"
                echo "lower owner: ${GITHUB_REPOSITORY_OWNER,,}"

# 脚本注入（为什么要用 env:，不要把 ${{ }} 直接写进 run:）

    lesson-11:
        runs-on: ubuntu-latest
        env:
            UNTRUSTED: 'hello $(echo INJECTED-COMMAND-RAN)'
        steps:
            - name: Unsafe - expression inlined into the script
              run: echo "${{ env.UNTRUSTED }}"
            - name: Safe - read from environment
              run: echo "$UNTRUSTED"

# environment: 和环境层的 vars

    lesson-12-no-env:
        runs-on: ubuntu-latest
        steps:
            - run: echo "without environment = ${{ vars.LAB_GREETING }}"

    lesson-12-with-env:
        runs-on: ubuntu-latest
        environment: lab
        steps:
            - run: echo "with environment    = ${{ vars.LAB_GREETING }}"
           