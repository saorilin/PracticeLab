name: Frontend CI

on:
    push:
        branches:
            - main
    pull_request:
permissions:
    contents: read

jobs:
    frontend-test:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
            - name: Set up NodeJS
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
            - name: Install dependencies
              working-directory: ./frontend
              run: npm ci
            - name: Check formatting
              working-directory: ./frontend
              run: npm run format:check
            - name: Lint code
              working-directory: ./frontend
              run: npm run lint
            - name: Type check
              working-directory: ./frontend
              run: npm run typecheck
            - name: Run tests 
              working-directory: ./frontend
              run: npm run test
            - name: Build frontend
              working-directory: ./frontend
              run: npm run build
            - name: Upload frontend build artifact
              uses: actions/upload-artifact@v7
              with:
                name: frontend-dist
                path: frontend/dist/
                if-no-files-found: error
                retention-days: 7