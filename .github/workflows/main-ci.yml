name: Main CI and Publish

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:    # ensure the publish job is not running concurrently 
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build-images.yml

  backend:
    uses: ./.github/workflows/backend-checks.yml

  frontend:
    uses: ./.github/workflows/frontend-checks.yml

  docker:
    needs: build
    uses: ./.github/workflows/docker-integration-checks.yml
    with:
      backend-image: ${{ needs.build.outputs.backend-image }}
      frontend-image: ${{ needs.build.outputs.frontend-image }}

  publish:
    needs: [build, backend, frontend, docker]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-images.yml
    with:
      backend-image: ${{ needs.build.outputs.backend-image }}
      frontend-image: ${{ needs.build.outputs.frontend-image }}