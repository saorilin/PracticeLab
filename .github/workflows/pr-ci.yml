name: PR CI

on:
    pull_request:
        branches: [main]    # Pull request to the main branch

permissions:
    contents: read

concurrency:    # cancels any in-progress runs for the same pull request
    group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    build:
        uses: ./.github/workflows/build-images.yml
    backend:
        uses: ./.github/workflows/backend-checks.yml
    
    frontend:
        uses: ./.github/workflows/frontend-checks.yml

    docker:
        needs: build
        uses: ./.github/workflows/docker-integration-checks.yml
        with:
            backend-image: ${{ needs.build.outputs.backend-image }}
            frontend-image: ${{ needs.build.outputs.frontend-image }}

    all-required-green:
        name: All required checks passed
        if: always()
        needs: [build, backend, frontend, docker]
        runs-on: ubuntu-latest
        steps:
            - name: Verify all required checks passed
              shell: bash
              env:
                  RESULTS: ${{ join(needs.*.result, ' ') }}
              run: |
                  echo "Results of needed jobs: $RESULTS"
                  for r in $RESULTS; do
                    if [ "$r" != "success" ]; then
                      echo "::error::At least one required check did not succeed (got: $r)"
                      exit 1
                    fi
                  done
                  echo "All required checks passed."
              
